; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Target hardware: ESP32-S3-WROOM-1 N16R8 (16MB Flash / 8MB OPI PSRAM)

[env:esp32-s3-wroom-1-n16r8]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino

; Partition table for 16MB Flash (双 OTA + SPIFFS)
board_build.partitions = partitions-16MB.csv

; N16R8 使用 OPI (Octal SPI) PSRAM, 必须显式启用
board_build.arduino.memory_type = qio_opi

; Flash 配置
board_build.flash_mode = dio
board_build.f_flash = 80000000
board_build.flash_size = 16MB

; USB 双功能: HID 键盘 + USB CDC 串口 (日志与桌面 App 协议均走 USB)
; UART0 仅保留为烧录口 (TXD0/RXD0), 不再作为日志输出
; LVGL：通过 include/ 路径与 LV_CONF_INCLUDE_SIMPLE 让 lv_conf_local.h 生效
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

; 串口监视器: USB CDC 已启用, 端口由系统枚举 (ESP32-S3 USB 设备)
; 烧录仍使用 UART0 (COM3) + esptool
monitor_speed = 115200
; monitor_port 由 PlatformIO 在 USB 设备列表中自动选择; 若需手动指定, 改为对应 COM 号

; 烧录配置: 走 UART0, 使用 esptool 默认复位策略 (DTR/RTS 自动下载)
upload_port = COM3
upload_protocol = esptool
upload_speed = 921600

lib_deps =
	lvgl/lvgl@8.3.11
	GFX Library for Arduino@1.6.0
	https://github.com/brofield/simpleini.git#4.19

; 阶段 01: USB HID Keyboard 已由 espressif/arduino-esp32 内置支持
; 依赖 ARDUINO_USB_MODE=1 / ARDUINO_USB_CDC_ON_BOOT=1（build_flags），
; 阶段 06 加 BLEKeyboard 库时再追加。