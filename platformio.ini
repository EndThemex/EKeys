[env:esp32-s3-wroom-1-n16r8]

platform = espressif32@6.8.0
board = esp32-s3-wroom-1-n16r8
framework = arduino

; ============================================================
; Flash: 16MB QSPI
; ============================================================

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; espressif32>=6.5 不再从自定义分区表解析 app 偏移（默认 0x10000），
; 必须显式指定 ota_0 的偏移，否则插件上传会把固件写到 0x10000 破坏分区布局。
board_upload.offset_address = 0x20000

; 本板闪存(厂商ID 0x46)在 QIO@80MHz 下读数不可靠：
; ROM 按 QIO 头加载 bootloader 第 2 段即失败(ets_loader.c 78)，
; 必须使用 DIO（DIO@80MHz 已验证可完整通过 ROM 加载阶段）。
board_build.flash_mode = dio
board_build.f_flash = 80000000L


; ============================================================
; PSRAM: 8MB OPI
; ============================================================

board_build.arduino.memory_type = dio_opi
board_build.psram_type = opi


; ============================================================
; Partition
; ============================================================

board_build.partitions = partitions-16MB.csv


; ============================================================
; Build
; ============================================================

build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

build_unflags =
    -std=gnu++11


; ============================================================
; Monitor
; ============================================================

monitor_speed = 115200


; ============================================================
; Upload
; ============================================================

upload_protocol = esptool
upload_speed = 921600


; ============================================================
; Libraries
; ============================================================

lib_deps =
    lvgl/lvgl@8.3.11
    GFX Library for Arduino@1.6.0
    https://github.com/brofield/simpleini.git#4.19
    bblanchon/ArduinoJson@^7.0.4
    madhephaestus/ESP32Encoder@^0.10.2
    mathertel/OneButton@^2.6.1
    https://github.com/t-vk/ESP32-BLE-Keyboard.git#b7aaf9bb711a04216e4417f1e2a6b0ee0eaeaf66
    esphome/ESP32-audioI2S@^2.3.0
    adafruit/Adafruit NeoPixel@^1.11.0
    kosme/arduinoFFT@^2.0.4


; ============================================================
; Source Filter
; ============================================================

build_src_filter =
    +<*>

    -<ui/ui_font_BebasNeueFont32.c>
    -<ui/ui_font_BebasNeueFont64.c>
    -<ui/ui_font_BebasNeueFont80.c>

    -<ui/ui_font_FontCKJGT32.c>
    -<ui/ui_font_FontCKJGT40.c>
    -<ui/ui_font_FontCKJGT48.c>
    -<ui/ui_font_FontCKJGT64.c>
    -<ui/ui_font_FontCKJGT80.c>