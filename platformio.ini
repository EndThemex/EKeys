; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
	lvgl/lvgl@8.3.11
	GFX Library for Arduino@1.6.0
	madhephaestus/ESP32Encoder@^0.11.7
	mathertel/OneButton@^2.5.0
	fastled/FastLED@3.6.0
	https://github.com/T-vK/ESP32-BLE-Keyboard/releases/download/0.3.0/ESP32-BLE-Keyboard.zip
build_flags =
	-DEKEYS_ENABLE_BLE=1
	-DEKEYS_DEVICE_NAME=\"EKeys\"

; 关 BLE 的备选环境（拷贝 env:esp32-s3-devkitc-1 整块、改 EKEYS_ENABLE_BLE=0 即可）：
; [env:esp32-s3-devkitc-1-no-ble]
; platform = espressif32@6.4.0
; board = esp32-s3-devkitc-1
; framework = arduino
; lib_deps =
; 	lvgl/lvgl@8.3.11
; 	GFX Library for Arduino@1.6.0
; 	madhephaestus/ESP32Encoder@^0.11.7
; 	mathertel/OneButton@^2.5.0
; 	fastled/FastLED@3.6.0
; build_flags =
; 	-DEKEYS_ENABLE_BLE=0

; ------------------------------------------------------------------
; Upload —— 烧录完成后自动重启靠 ESP32-S3 的 USB-Serial/JTAG 或外置
; CH340/CP2102 拉 DTR+RTS→EN/BOOT 实现。esptool 烧完会主动复位一次。
;   upload_protocol = esptool    ; 默认就是 esptool，写死避免被覆盖
;   upload_speed    = 921600     ; 2M 在某些桥下不稳，先稳为主
;   upload_port     = COMx       ; 如需固定串口，改为你的实际端口
; ------------------------------------------------------------------
upload_protocol = esptool
upload_speed = 921600
; upload_port = COM7   ; 取消注释并改成你的实际串口

; ------------------------------------------------------------------
; Monitor —— 显式禁用 DTR/RTS，避免每次开 Serial Monitor 都把板子复位一次
; ------------------------------------------------------------------
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
