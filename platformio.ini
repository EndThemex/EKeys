; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Target hardware: ESP32-S3-WROOM-1 N16R8 (16MB Flash / 8MB OPI PSRAM)

[env:esp32-s3-wroom-1-n16r8]
platform = espressif32@6.4.0
board = esp32-s3-wroom-1
framework = arduino

; Partition table for 16MB Flash (双 OTA + SPIFFS)
board_build.partitions = partitions-16MB.csv

; N16R8 使用 OPI (Octal SPI) PSRAM, 必须显式启用
board_build.arduino.memory_type = qio_opi

; Flash 配置
board_build.flash_mode = dio
board_build.f_flash = 80000000
board_build.flash_size = 16MB

; USB CDC 已关闭, 日志与烧录均走 UART0
; 如需重新启用 CDC, 取消下面两行注释即可:
build_flags =
    ; -DARDUINO_USB_MODE=1
    ; -DARDUINO_USB_CDC_ON_BOOT=1

; 串口监视器 (UART0, 需外接 USB-UART 桥接器)
monitor_speed = 115200
monitor_port = COM3

; 烧录配置: 走 UART0, 使用 esptool 默认复位策略 (DTR/RTS 自动下载)
upload_port = COM3
upload_protocol = esptool
upload_speed = 921600

lib_deps =
	lvgl/lvgl@8.3.11
	GFX Library for Arduino@1.6.0