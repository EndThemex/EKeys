; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Target hardware: ESP32-S3-WROOM-1 N16R8 (16MB Flash / 8MB OPI PSRAM)

[env:esp32-s3-wroom-1-n16r8]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino

; Partition table for 16MB Flash (双 OTA + SPIFFS)
board_build.partitions = partitions-16MB.csv

; N16R8 使用 OPI (Octal SPI) PSRAM, 必须显式启用
board_build.arduino.memory_type = qio_opi

; Flash 配置
board_build.flash_mode = dio
board_build.f_flash = 80000000
board_build.flash_size = 16MB

; USB 双功能: HID 键盘 + USB CDC 串口 (日志与桌面 App 协议均走 USB)
; UART0 仅保留为烧录口 (TXD0/RXD0), 不再作为日志输出
; LVGL：通过 include/ 路径与 LV_CONF_INCLUDE_SIMPLE 让 lv_conf_local.h 生效
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

; 平台默认追加 -std=gnu++11 会覆盖上面的 gnu++17, 必须显式移除
build_unflags =
    -std=gnu++11

; 串口监视器: USB CDC 已启用, 端口由系统枚举 (ESP32-S3 USB 设备)
; 烧录仍使用 UART0 (COM3) + esptool
monitor_speed = 115200
; monitor_port 由 PlatformIO 在 USB 设备列表中自动选择; 若需手动指定, 改为对应 COM 号

; 烧录配置: 走 UART0, 使用 esptool 默认复位策略 (DTR/RTS 自动下载)
upload_port = COM3
upload_protocol = esptool
upload_speed = 921600

lib_deps =
	lvgl/lvgl@8.3.11
	GFX Library for Arduino@1.6.0
	https://github.com/brofield/simpleini.git#4.19
	bblanchon/ArduinoJson@^7.0.4
	madhephaestus/ESP32Encoder@^0.10.2
	mathertel/OneButton@^2.6.1
	; 阶段 06：BLE 键盘 / I2S 音频 / WS2812B / FFT
	https://github.com/t-vk/ESP32-BLE-Keyboard.git
	; Registry 无 schreibfaul1/ESP32-audioI2S 条目, 且无 3.0.11 tag; 沿用参考工程的 esphome fork
	esphome/ESP32-audioI2S@^2.3.0
	adafruit/Adafruit NeoPixel@^1.11.0
	kosme/arduinoFFT@^2.0.4

; 阶段 05: 排除 UI 未引用的大字号字体（与参考工程一致的裁剪清单）
build_src_filter =
	+<*>
	-<ui/ui_font_BebasNeueFont32.c>
	-<ui/ui_font_BebasNeueFont64.c>
	-<ui/ui_font_BebasNeueFont80.c>
	-<ui/ui_font_FontCKJGT32.c>
	-<ui/ui_font_FontCKJGT40.c>
	-<ui/ui_font_FontCKJGT48.c>
	-<ui/ui_font_FontCKJGT64.c>
	-<ui/ui_font_FontCKJGT80.c>

; 阶段 01: USB HID Keyboard 已由 espressif/arduino-esp32 内置支持
; 依赖 ARDUINO_USB_MODE=1 / ARDUINO_USB_CDC_ON_BOOT=1（build_flags），
; 阶段 06 加 BLEKeyboard 库时再追加。