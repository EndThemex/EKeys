; Profile 0（keymap1.ini）键映射示例（FEATURE_DOC §3.1 / §3.2）
; 每个 [keyN] 对应一个应用键（1~11）：
;   function_key=  单个功能串（如 KEY_FUNCTION_ASR / MEDIA_PLAY），优先于 normal_key
;   normal_key=    普通键序列，最多 6 个，用 + 分隔同时按下
;   macros_key=    宏键序列，最多 5 个，用 + 分隔按顺序先压后弹

[key1]
normal_key=a

[key2]
normal_key=b

[key3]
normal_key=c

[key4]
normal_key=d

[key5]
normal_key=e

[key6]
normal_key=f

[key7]
normal_key=g

[key8]
normal_key=h

[key9]
normal_key=i

[key10]
normal_key=j

[key11]
normal_key=k
